# ==============================================================================
# ANDROIDX & JETPACK CONFIGURATION
# ==============================================================================
# Enables the use of AndroidX libraries (Required for AppCompat, Core-KTX, Shizuku, etc.)
android.useAndroidX=true

# Enables non-transitive R classes for faster incremental compilation and smaller APKs
android.nonTransitiveRClass=true

# Automatically converts legacy third-party dependencies to AndroidX at build time
android.enableJetifier=true


# ==============================================================================
# BUILD PERFORMANCE & DAEMON OPTIMIZATIONS
# ==============================================================================
# Allocates JVM heap size for the Gradle Daemon (adjust based on CI runner memory)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enables parallel execution of tasks across submodules
org.gradle.parallel=true

# Reuses build outputs from previous runs to speed up compilation
org.gradle.caching=true

# Enables Configuration Caching for faster task execution graphs
org.gradle.configuration-cache=true

# Enables the Gradle Daemon to persist across builds
org.gradle.daemon=true


# ==============================================================================
# KOTLIN OPTIMIZATIONS
# ==============================================================================
# Runs Kotlin compilation in process for faster builds
kotlin.incremental=true

# Enables parallel execution of Kotlin compilation tasks
kotlin.parallel.tasks.in.project=true


# ==============================================================================
# NDK & NATIVE LIBRARIES
# ==============================================================================
# Suppresses NDK side-by-side version mismatch warnings when cross-compiling
android.suppressUnsupportedCompileSdk=36
