name: Build Android App & Native Engines

on:
  workflow_dispatch:

jobs:
  build:
    name: Cross-Compile & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-Compile Rust Library (arm64-v8a & x86_64)
        run: |
          cd rust
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release

      - name: Clone Tailscale Upstream
        run: |
          git clone --depth 1 https://github.com/tailscale/tailscale.git /tmp/tailscale

      - name: Cross-Compile libtailscale (arm64-v8a & x86_64)
        run: |
          # Dynamically locate libtailscale directory regardless of upstream changes
          LIBTAILSCALE_DIR=$(find /tmp/tailscale -type f -name "main.go" -path "*/libtailscale/*" -exec dirname {} + | head -n 1)

          if [ -z "$LIBTAILSCALE_DIR" ]; then
            # Fallback search if path structure differs
            LIBTAILSCALE_DIR=$(find /tmp/tailscale -type d -name "libtailscale" | head -n 1)
          fi

          if [ -z "$LIBTAILSCALE_DIR" ]; then
            echo "Error: Could not locate libtailscale directory inside /tmp/tailscale"
            exit 1
          fi

          echo "Targeting libtailscale at: $LIBTAILSCALE_DIR"
          cd "$LIBTAILSCALE_DIR"

          # Resolve NDK path reliably
          NDK_PATH="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"

          # Ensure target jniLibs directories exist
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/x86_64

          # Build arm64-v8a libtailscale.so
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          CC=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang \
          go build -buildmode=c-shared -o $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libtailscale.so .

          # Build x86_64 libtailscale.so
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
          CC=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang \
          go build -buildmode=c-shared -o $GITHUB_WORKSPACE/android/app/src/main/jniLibs/x86_64/libtailscale.so .

      - name: Build Debug APK
        run: gradle :android:app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.jeremy.pdanet.bridge-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
