[package]
name = "socks_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.38", features = ["net", "rt-multi-thread", "io-util", "sync", "macros"] }
cxx = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[build-dependencies]
cxx-build = "1.0"
